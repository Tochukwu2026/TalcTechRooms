server {
  # Cloud Run injects the real port to listen on via the $PORT env var - this file is run
  # through envsubst (see Dockerfile's CMD) so that substitution actually happens at container
  # start, not baked in at image-build time.
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # React Router (BrowserRouter, per App.jsx) serves routes like /renters or /price-caps as
  # real paths, not hash fragments - nginx has no idea those aren't real files, so anything that
  # doesn't match a real static asset falls back to index.html and the client-side router takes
  # over from there. Without this, refreshing on /renters would 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
